owner: ahead.guru # Your GitHub organization or username, where this repository lives
repo: upptime # The name of this repository

sites:
  - name: Ahead.guru
    url: https://www.ahead.guru/
  - name: Ahead.guru Blog
    url: https://ozbillwang.github.io/

status-website:
  # Add your custom domain name, or remove the `cname` line if you don't have a domain
  # Uncomment the `baseUrl` line if you don't have a custom domain and add your repo name there
  cname: status.ahead.guru
  # baseUrl: /your-repo-name
  logoUrl: https://raw.githubusercontent.com/upptime/upptime.js.org/master/static/img/icon.svg
  name: Status Page
  introTitle: "**Ahead Guru Status** is the dedicated status monitor for our services."
  introMessage: This status page reflects **real-time** updates directly from our internal systems, ensuring transparency without the need for a dedicated server setup
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

